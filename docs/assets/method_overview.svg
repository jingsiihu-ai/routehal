<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">RouteHal technical overview</title>
  <desc id="desc">A research diagram showing how RouteHal compares a generated token's mixture-of-experts routing distribution with an attention-weighted visual routing prototype, aggregates normalized Jensen-Shannon divergence across layers, calibrates the signal, and optionally gates contrastive decoding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7FAFF"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748B"/></marker>
    <style>
      .title{font:700 34px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.subtitle{font:500 16px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .h{font:700 18px Inter,Segoe UI,Arial,sans-serif;fill:#0F172A}.label{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .small{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#64748B}.eq{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#312E81}
      .card{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;rx:20;filter:url(#shadow)}.soft{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.2;rx:12}
      .arrow{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="70" y="65" class="title">RouteHal</text>
  <text x="70" y="94" class="subtitle">Expert-routing divergence as a token-level visual-grounding signal in MoE vision-language models</text>
  <g transform="translate(1110,38)"><rect width="220" height="40" rx="20" fill="#EDE9FE"/><text x="110" y="25" text-anchor="middle" class="label" fill="#6D28D9">training-free · token-level</text></g>

  <!-- Stage 1 -->
  <g transform="translate(55,135)">
    <rect class="card" width="295" height="365"/>
    <circle cx="32" cy="34" r="17" fill="#DBEAFE"/><text x="32" y="40" text-anchor="middle" class="label" fill="#1D4ED8">1</text>
    <text x="60" y="40" class="h">Generation state</text>
    <text x="26" y="75" class="small">Image → visual patch tokens</text>
    <rect x="25" y="92" width="245" height="145" rx="16" fill="#DBEAFE" stroke="#93C5FD"/>
    <circle cx="93" cy="154" r="30" fill="#FCD34D"/><rect x="68" y="181" width="50" height="20" rx="10" fill="#F59E0B"/>
    <path d="M178 190 Q208 130 242 185" fill="none" stroke="#22C55E" stroke-width="12" stroke-linecap="round"/>
    <g fill="none" stroke="#2563EB" stroke-width="1.3" opacity="0.7">
      <path d="M25 128H270M25 164H270M25 200H270"/><path d="M74 92V237M123 92V237M172 92V237M221 92V237"/>
    </g>
    <text x="26" y="272" class="small">Current prediction token</text>
    <rect x="25" y="287" width="245" height="52" rx="12" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="43" y="319" class="label">“… a yellow</text><rect x="142" y="300" width="79" height="27" rx="8" fill="url(#violet)"/><text x="181" y="319" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="white">umbrella</text><text x="225" y="319" class="label">”</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(385,135)">
    <rect class="card" width="360" height="365"/>
    <circle cx="32" cy="34" r="17" fill="#EDE9FE"/><text x="32" y="40" text-anchor="middle" class="label" fill="#6D28D9">2</text>
    <text x="60" y="40" class="h">Extract internal signals</text>
    <text x="25" y="78" class="label">Prediction → visual attention</text>
    <g transform="translate(25,95)">
      <rect width="310" height="70" class="soft"/>
      <g transform="translate(20,18)"><rect width="32" height="34" rx="5" fill="#DBEAFE"/><rect x="42" width="32" height="34" rx="5" fill="#BFDBFE"/><rect x="84" width="32" height="34" rx="5" fill="#93C5FD"/><rect x="126" width="32" height="34" rx="5" fill="#60A5FA"/><rect x="168" width="32" height="34" rx="5" fill="#2563EB"/><rect x="210" width="32" height="34" rx="5" fill="#60A5FA"/><rect x="252" width="32" height="34" rx="5" fill="#DBEAFE"/></g>
      <text x="155" y="65" text-anchor="middle" class="small">attention mass αₗ,t,j over visual tokens</text>
    </g>
    <text x="25" y="200" class="label">MoE router distributions</text>
    <g transform="translate(25,218)">
      <text x="0" y="12" class="small">visual patches</text>
      <g transform="translate(95,0)"><rect width="190" height="13" rx="6" fill="#E2E8F0"/><rect width="48" height="13" rx="6" fill="#2563EB"/><rect x="48" width="72" height="13" fill="#7C3AED"/><rect x="120" width="42" height="13" fill="#EC4899"/><rect x="162" width="28" height="13" rx="6" fill="#F59E0B"/></g>
      <g transform="translate(95,27)"><rect width="190" height="13" rx="6" fill="#E2E8F0"/><rect width="25" height="13" rx="6" fill="#2563EB"/><rect x="25" width="95" height="13" fill="#7C3AED"/><rect x="120" width="27" height="13" fill="#EC4899"/><rect x="147" width="43" height="13" rx="6" fill="#F59E0B"/></g>
      <g transform="translate(95,54)"><rect width="190" height="13" rx="6" fill="#E2E8F0"/><rect width="67" height="13" rx="6" fill="#2563EB"/><rect x="67" width="38" height="13" fill="#7C3AED"/><rect x="105" width="60" height="13" fill="#EC4899"/><rect x="165" width="25" height="13" rx="6" fill="#F59E0B"/></g>
      <text x="0" y="98" class="small">token t</text>
      <g transform="translate(95,86)"><rect width="190" height="16" rx="8" fill="#E2E8F0"/><rect width="24" height="16" rx="8" fill="#2563EB"/><rect x="24" width="30" height="16" fill="#7C3AED"/><rect x="54" width="108" height="16" fill="#EC4899"/><rect x="162" width="28" height="16" rx="8" fill="#F59E0B"/></g>
      <text x="190" y="126" text-anchor="middle" class="small">full pre-dispatch router probabilities across experts</text>
    </g>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(780,135)">
    <rect class="card" width="270" height="365"/>
    <circle cx="32" cy="34" r="17" fill="#DCFCE7"/><text x="32" y="40" text-anchor="middle" class="label" fill="#15803D">3</text>
    <text x="60" y="40" class="h">Visual prototype</text>
    <text x="24" y="77" class="small">Attention-weighted expert profile</text>
    <rect x="24" y="95" width="222" height="84" class="soft"/>
    <text x="135" y="125" text-anchor="middle" class="eq">rᵛₗ,t = Σⱼ αₗ,t,j rₗ,j</text>
    <text x="135" y="153" text-anchor="middle" class="small">renormalized over image patches</text>
    <g transform="translate(38,207)">
      <text x="0" y="12" class="small">rᵛ</text><rect x="32" width="175" height="18" rx="9" fill="#E2E8F0"/><rect x="32" width="55" height="18" rx="9" fill="#2563EB"/><rect x="87" width="66" height="18" fill="#7C3AED"/><rect x="153" width="31" height="18" fill="#EC4899"/><rect x="184" width="23" height="18" rx="9" fill="#F59E0B"/>
      <text x="0" y="62" class="small">rᵗ</text><rect x="32" y="50" width="175" height="18" rx="9" fill="#E2E8F0"/><rect x="32" y="50" width="24" height="18" rx="9" fill="#2563EB"/><rect x="56" y="50" width="31" height="18" fill="#7C3AED"/><rect x="87" y="50" width="98" height="18" fill="#EC4899"/><rect x="185" y="50" width="22" height="18" rx="9" fill="#F59E0B"/>
      <path d="M48 92 C86 122 154 122 191 92" fill="none" stroke="#DB2777" stroke-width="3"/>
      <text x="119" y="131" text-anchor="middle" class="label" fill="#BE185D">routing mismatch</text>
    </g>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(1085,135)">
    <rect class="card" width="260" height="365"/>
    <circle cx="32" cy="34" r="17" fill="#FCE7F3"/><text x="32" y="40" text-anchor="middle" class="label" fill="#BE185D">4</text>
    <text x="60" y="40" class="h">Route divergence</text>
    <rect x="22" y="75" width="216" height="68" class="soft"/>
    <text x="130" y="105" text-anchor="middle" class="eq">Dₗ,t = JS(rᵗ || rᵛ)</text>
    <text x="130" y="129" text-anchor="middle" class="small">normalized by log 2</text>
    <text x="22" y="177" class="small">aggregate selected MoE layers</text>
    <g transform="translate(24,191)">
      <rect width="210" height="88" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
      <g transform="translate(16,13)"><rect width="15" height="54" rx="3" fill="#DBEAFE"/><rect x="23" y="14" width="15" height="40" rx="3" fill="#BFDBFE"/><rect x="46" y="26" width="15" height="28" rx="3" fill="#93C5FD"/><rect x="69" y="7" width="15" height="47" rx="3" fill="#60A5FA"/><rect x="92" y="20" width="15" height="34" rx="3" fill="#A78BFA"/><rect x="115" y="2" width="15" height="52" rx="3" fill="#8B5CF6"/><rect x="138" y="17" width="15" height="37" rx="3" fill="#EC4899"/><rect x="161" y="9" width="15" height="45" rx="3" fill="#F472B6"/></g>
      <text x="105" y="82" text-anchor="middle" class="small">layer-wise Dₗ,t</text>
    </g>
    <rect x="22" y="300" width="216" height="42" rx="12" fill="url(#violet)"/>
    <text x="130" y="326" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="white">Hroute(t) = Σₗ wₗDₗ,t</text>
  </g>

  <path class="arrow" d="M350 316H380"/><path class="arrow" d="M745 316H775"/><path class="arrow" d="M1050 316H1080"/>

  <!-- Bottom decoding panel -->
  <g transform="translate(55,545)">
    <rect class="card" width="1290" height="205"/>
    <text x="28" y="38" class="h">Optional calibrated decoding intervention</text>
    <text x="28" y="65" class="small">The numerical core remains diagnostic; a model adapter may use the score as a transparent gate.</text>
    <g transform="translate(30,92)"><rect width="220" height="76" class="soft"/><text x="110" y="28" text-anchor="middle" class="label">Grounded calibration set</text><text x="110" y="54" text-anchor="middle" class="eq">zₜ = (Hₜ − μg) / σg</text></g>
    <path class="arrow" d="M258 130H326"/>
    <g transform="translate(335,92)"><rect width="205" height="76" rx="18" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/><text x="102" y="28" text-anchor="middle" class="label">Adaptive gate</text><text x="102" y="54" text-anchor="middle" class="eq">γₜ = f(zₜ)</text></g>
    <path class="arrow" d="M548 130H616"/>
    <g transform="translate(625,82)"><rect width="280" height="96" class="soft"/><text x="140" y="28" text-anchor="middle" class="label">Contrastive token score</text><text x="140" y="55" text-anchor="middle" class="eq">sₜ = logitsᵢₘg − γₜ logitsᵗᵉˣᵗ</text><text x="140" y="79" text-anchor="middle" class="small">strength rises only when routing mismatch is high</text></g>
    <path class="arrow" d="M913 130H981"/>
    <g transform="translate(990,92)"><rect width="265" height="76" rx="18" fill="url(#blue)"/><text x="132" y="28" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="15" font-weight="700" fill="white">Evidence-aware next token</text><text x="132" y="54" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="12" fill="#DBEAFE">observable · testable · model-agnostic</text></g>
  </g>
  <text x="1345" y="798" text-anchor="end" class="small">Schematic — no benchmark values implied</text>
</svg>
