[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routehal"
version = "0.1.0"
description = "Model-agnostic expert-routing divergence utilities for MoE vision-language research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jingsi Hu"}]
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
